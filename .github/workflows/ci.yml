name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      APP_BASE_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      SETTINGS_ENCRYPTION_KEY: ci-settings-encryption-key-at-least-32-characters
      ROOT_ADMIN_EMAILS: admin@example.com
      TRUSTED_ORIGINS: http://localhost:3000
      AI_API_KEY: ci-placeholder
      AI_BASE_URL: https://example.com
      AI_MODEL: gpt-5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
